    <!-- Google Analytics 4 — defina VITE_GA_ID no .env com seu Measurement ID -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      // Consent Mode v2: analytics bloqueado por padrão até o usuário aceitar
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        wait_for_update: 500
      });
      gtag('config', '%VITE_GA_ID%', {
        send_page_view: true,
        cookie_flags: 'SameSite=None;Secure'
      });
    </script>
